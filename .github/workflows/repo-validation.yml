name: KMP Skills Repo Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Skills Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-dev.txt
            website/requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Install documentation dependencies
        run: pip install -r website/requirements.txt

      - name: Run repo validation gates
        run: |
          python3 scripts/scan_skill_issues.py
          python3 skills/kmp-audit/scripts/audit_skills_repo.py .
          python3 skills/kmp-expert/scripts/validate_skill_map.py --repo-root .
          python3 skills/kmp-expert/scripts/validate_keyword_routing.py --repo-root .
          python3 -m pytest tests -v --tb=short

      - name: Build searchable skill reference
        run: |
          python3 scripts/build_skill_site.py
          mkdocs build -f website/mkdocs.yml --strict
